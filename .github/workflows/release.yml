name: Release binaries

# On a pushed v* tag: compile standalone qrup binaries and attach them to that tag's GitHub release.
# Run it by hand to build the binaries as workflow artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # Each entry builds `target:asset` pairs and smoke-tests the one the runner can execute.
        # Both macOS binaries share one job, because macOS runners are scarce and often queue for long.
        # Baseline x64 builds do not need AVX2, so they also run on older CPUs and under Rosetta.
        include:
          - os: macos-latest
            builds: bun-darwin-arm64:darwin-arm64 bun-darwin-x64-baseline:darwin-x64
            smoke: darwin-arm64
          - os: ubuntu-latest
            builds: bun-linux-x64-baseline:linux-x64
            smoke: linux-x64
          - os: ubuntu-24.04-arm
            builds: bun-linux-arm64:linux-arm64
            smoke: linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: |
          bun run build:client
          for build in $BUILDS; do
            target="${build%%:*}" asset="${build#*:}"
            bun scripts/build-binary.ts "$target"
            mkdir -p "out/$asset"
            mv "dist/qrup-${target#bun-}" "out/$asset/qrup"
          done
        env:
          BUILDS: ${{ matrix.builds }}

      - name: Sign (ad hoc)
        if: runner.os == 'macOS'
        run: codesign --force --sign - out/*/qrup

      - name: Smoke test
        run: |
          dir=$(mktemp -d)
          (cd "$dir" && "$GITHUB_WORKSPACE/out/$SMOKE/qrup" --port 3200 > server.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3200/api/files && break; sleep 1; done
          curl -sf http://127.0.0.1:3200/ | grep -q '<div id="root">'
          test -d "$dir/uploads"
          cat "$dir/server.log"
        env:
          SMOKE: ${{ matrix.smoke }}

      - name: Package
        run: for dir in out/*; do tar -czf "qrup-$(basename "$dir").tar.gz" -C "$dir" qrup; done

      - uses: actions/upload-artifact@v4
        with:
          name: qrup-${{ matrix.os }}
          path: qrup-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qrup-*
          merge-multiple: true

      - name: Attach to the GitHub release
        run: |
          sha256sum qrup-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" qrup-*.tar.gz SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  homebrew:
    # Points totherush/homebrew-tap at the new release. HOMEBREW_TAP_DEPLOY_KEY is the private
    # half of a write deploy key on that repo.
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: totherush/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update the formula
        run: |
          gh release download "$TAG" --pattern SHA256SUMS
          bun scripts/update-formula.ts tap/Formula/qrup.rb "${TAG#v}" SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

      - name: Commit and push
        working-directory: tap
        run: |
          if git diff --quiet; then echo "Formula already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update qrup to ${TAG#v}"
          git push
        env:
          TAG: ${{ github.ref_name }}
